name: sidekick
description: Sidekick, an offline-first analog companion.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  drift: 2.34.1
  drift_flutter: 0.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.0.1
  flutter_riverpod: 3.3.2
  go_router: 17.3.0
  sqlite3: 3.3.4
  supabase_flutter: 2.16.0

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Italic.ttf
          style: italic
          weight: 400
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
